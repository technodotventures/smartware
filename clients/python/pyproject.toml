[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartware-client"
version = "2.0.0"
description = "Python client for the Smartware memory protocol, with LangGraph, mem0 and Letta compatibility shims"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: Apache Software License",
  "Typing :: Typed",
]

[tool.setuptools]
packages = ["smartware_client"]

[tool.setuptools.package-data]
smartware_client = ["py.typed"]
