name: publish

# Publishes the package when a version tag is pushed. Deliberately tag-triggered: the tag, the
# published artifact, and the release identity in docs/conformance-status.md must be one object,
# which is exactly how 0.6.3 drifted away from the documented surface.
#
# Requires a trusted publisher configured for this repository on npmjs.com (OIDC — no token
# secret is stored here). Until that exists, `npm publish` will fail and publish nothing.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # OIDC for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # node 24 (npm 11.5.1+) is required for OIDC trusted publishing; node 22's
      # npm 10.x cannot perform the exchange at all. The bundled version is
      # checked below rather than assumed.
      #
      # registry-url is set to match the documented trusted-publishing example.
      # Note what that means: setup-node writes an .npmrc containing
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and, historically,
      # exported a placeholder value for that variable (actions/setup-node#1440).
      # npm runs the OIDC exchange before it reads that credential, so the
      # exchange decides the outcome; the step below prints whether the variable
      # is present so a failure on the fallback path cannot be mistaken for the
      # exchange failing.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false   # never cache in release builds

      # Fail loudly here rather than as a misleading 404 or ENEEDAUTH at publish.
      - name: Assert npm supports trusted publishing (>= 11.5.1)
        run: |
          V=$(npm --version)
          echo "npm $V"
          node -e "const [a,b]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&b<5)) { console.error('npm ' + process.argv[1] + ' is below 11.5.1 and cannot perform the OIDC exchange'); process.exit(1) }" "$V"

      # npm's oidc module never throws. It returns silently and reports its reason
      # only at verbose level, after which the publish fails as a plain
      # "need auth" or a 404 that points at permissions rather than at the
      # exchange. Print the environment facts here so the two failure modes stay
      # distinguishable: missing id-token permission versus an exchange the
      # registry refused.
      - name: OIDC environment check
        run: |
          node -e "['ACTIONS_ID_TOKEN_REQUEST_URL','ACTIONS_ID_TOKEN_REQUEST_TOKEN','NPM_ID_TOKEN','NODE_AUTH_TOKEN','GITHUB_REPOSITORY','GITHUB_REPOSITORY_OWNER','GITHUB_WORKFLOW_REF','GITHUB_REF'].forEach(n => { const v = process.env[n]; console.log(n + ':', v === undefined ? 'ABSENT' : (n.endsWith('TOKEN') ? 'present' : v)) })"

      - run: npm ci

      # Never publish something that has not passed the gate this repo already trusts.
      - run: npm run build
      - run: npm run verify:schemas
      - run: npm run verify:saas

      - name: Publish with provenance
        env:
          # Surface npm's oidc diagnostics: "Skipped because incorrect
          # permissions for id-token within GitHub workflow", or "Failed token
          # exchange request with body message: <registry reason>". npm redacts
          # credentials from its own log output.
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
          npm publish --provenance --access public
