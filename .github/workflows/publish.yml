name: publish

# Publishes the package when a version tag is pushed. Deliberately tag-triggered: the tag, the
# published artifact, and the release identity in docs/conformance-status.md must be one object,
# which is exactly how 0.6.3 drifted away from the documented surface.
#
# Requires a trusted publisher configured for this repository on npmjs.com (OIDC — no token
# secret is stored here). Until that exists, `npm publish` will fail and publish nothing.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # OIDC for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # node 24 (npm 11.6+) is required for OIDC trusted publishing. Node 22's
      # npm 10.x cannot perform the OIDC exchange at all.
      #
      # registry-url is deliberately NOT set, and that is not an oversight. With
      # it, setup-node writes an .npmrc containing
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and exports a
      # placeholder value for that variable when one is not supplied. npm then
      # finds a credential for the registry, prefers it over the OIDC exchange,
      # and sends the placeholder: the publish goes out anonymous and the registry
      # answers 404 "could not be found or you do not have permission", not 401.
      # The provenance step still succeeds in that state, which is what makes an
      # unauthenticated publish read like a permissions problem rather than a
      # missing credential. See actions/setup-node#1440.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false   # never cache in release builds

      # Fail loudly here rather than as a misleading 404 at the publish step.
      - name: Assert npm supports trusted publishing (>= 11.5.1)
        run: |
          V=$(npm --version)
          echo "npm $V"
          node -e "const [a,b]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&b<5)) { console.error('npm ' + process.argv[1] + ' is below 11.5.1 and cannot perform the OIDC exchange'); process.exit(1) }" "$V"

      - run: npm ci

      # Never publish something that has not passed the gate this repo already trusts.
      - run: npm run build
      - run: npm run verify:schemas
      - run: npm run verify:saas

      - name: Publish with provenance
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
          npm publish --provenance --access public
